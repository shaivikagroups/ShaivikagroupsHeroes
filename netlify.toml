[build]
  command = "npm install"
  functions = "functions"
  publish = "public"

[functions]
  node_bundler = "esbuild"
  included_files = ["data/**", "lib/**"]

# API calls → serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
  force = true

# Sitemap & Robots → serverless function (dynamic)
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/api/sitemap.xml"
  status = 200
  force = true

[[redirects]]
  from = "/robots.txt"
  to = "/.netlify/functions/api/robots.txt"
  status = 200
  force = true

# Clean portfolio URLs → SSR via serverless function
# Static files in /public are served natively FIRST (no force = true means Netlify checks static first)
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
