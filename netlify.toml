[build]
  command = "npm install"
  functions = "functions"
  publish = "public"

[functions]
  node_bundler = "esbuild"
  included_files = ["data/**"]

# API calls go to the serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
  force = true

# Ensure root always serves the form (index.html)
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

# Clean portfolio URLs: serve portfolio.html statically (JS reads slug from path)
[[redirects]]
  from = "/*"
  to = "/portfolio.html"
  status = 200
